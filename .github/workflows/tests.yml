name: Test public workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m nsclc_toxicity experiment --input data/sample.csv --output results/ci_experiment
  public-ct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[imaging,segmentation,notebook,test]"
      - run: python -m ipykernel install --sys-prefix --name nsclc_toxicity --display-name "NSCLC Toxicity (CT)"
      - run: python -m nsclc_toxicity download-demo-ct
      - run: python -m nsclc_toxicity infer-ct --manifest data/public_ct/clinical.csv --output results/public_ct
      - run: NSCLC_RUN_PUBLIC_CT_TEST=1 python -m pytest -q
      - run: jupyter nbconvert --to notebook --execute notebooks/quickstart.ipynb --output executed_ct_notebook.ipynb --output-dir results --ExecutePreprocessor.timeout=1200
